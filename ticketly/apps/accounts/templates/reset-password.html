{% extends 'auth.html' %}
{% block authcontent %}
<h2 class="auth-title h4 mb-1">Modificar Senha</h2>
    <p class="text-muted mb-4">Entre com sua senha e confirmação de senha.</p>

    <form class="mt-2">
        <div class="mb-2">
            <label for="password" class="form-label">Senha</label>
            <input id="password" type="password" class="form-control" placeholder="••••••••"
                autocomplete="current-password" required>
        </div>

        <div class="mb-2">
            <label for="password" class="form-label">Confirmar Senha</label>
            <input id="password" type="password" class="form-control" placeholder="••••••••"
                autocomplete="current-password" required>
        </div>

        <div class="d-grid mt-3">
            <button type="submit" class="btn btn-primary btn-main">Modificar Senha</button>
        </div>

        <div class="text-center mt-2">
            <!-- “Reset password” como ação secundária -->
            <a href="{% url 'login' %}" class="btn btn-outline-secondary btn-sm mt-1">
                Voltar para o Login
            </a>
        </div>
    </form>
{% endblock %}
