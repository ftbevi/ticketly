{% extends 'base.html' %}
{% block content %}

<style>
    :root {
        --panel-accent: #218049;
        /* cor do painel direito */
        --panel-accent-2: #0e5c2e;
        /* tom secundário */
    }

    body {
        min-height: 100vh;
        background: #27AE60;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }

    .auth-left {
        padding: 40px 36px 28px;
        background: #fff;
        border-radius: 8px;
    }

    .brand-mini {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--panel-accent);
        display: inline-block;
        margin-right: 8px;
    }

    .auth-title {
        font-weight: 700;
        letter-spacing: .5px;
    }

    .form-control {
        border-radius: 10px;
        height: 44px;
    }

    .btn-main {
        border-radius: 22px;
        padding: .6rem 1.2rem;
    }

    .title {
        font-size: 60px;
        font-weight: 900;
        color: #fff;
        margin-bottom: 16px;
    }
</style>
<div class="d-flex flex-column align-items-center title">
    Ticketly
</div>
<div class="auth-left h-100 d-flex flex-column">
    {% block authcontent %}{% endblock %}
</div>
{% endblock %}
