{% extends 'auth.html' %}
{% block authcontent %}
<h2 class="auth-title h4 mb-1">Login</h2>
<p class="text-muted mb-4">Entre com seu usuário e senha para continuar.</p>

<form id="login" class="mt-2" method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label for="username" class="form-label">Usuário</label>
        <input id="username" name="username" type="text" class="form-control" placeholder="seu.usuario" autocomplete="username"
            required>
    </div>
    <div class="mb-2">
        <label for="password" class="form-label">Senha</label>
        <input id="password" name="password" type="password" class="form-control" placeholder="••••••••" autocomplete="current-password"
            required>
    </div>

    <div class="d-grid mt-3">
        <button type="submit" class="btn btn-primary btn-main">Login</button>
    </div>
    <div class="text-center mt-2">
        <!-- “Reset password” como ação secundária -->
        <a href="{% url 'reset_password' %}" class="btn btn-outline-secondary btn-sm mt-1">
            Modificar Senha
        </a>
    </div>
</form>
{% endblock %}
